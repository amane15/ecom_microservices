syntax =  "proto3";

package product.v1;

option go_package = "github.com/amane15/ecom_microservice/proto/product/v1;productpb";

service ProductService {
  rpc CheckVariantExists (CheckVariantExistsRequest)
    returns (CheckVariantExistsResponse);
}

message CheckVariantExistsRequest {
  int64 variant_id = 1;
}

message CheckVariantExistsResponse {
  bool exists = 1;
}
