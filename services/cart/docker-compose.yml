services:
  carts-service:
    build:
      context: .
    volumes:
      - .:/app
    ports:
      - "4000:4000"
    depends_on:
      - carts-db

  carts-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carts
    ports:
      - "5432:5432"

    volumes:
      - cartsdb:/var/lib/postgresql/data

volumes:
  cartsdb:
